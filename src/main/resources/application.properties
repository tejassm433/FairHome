spring.application.name=FairHome Allocation

server.port=8080

# database configuration
spring.datasource.url=jdbc:h2:file:./data/fairhome;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=com.fairhome.config.VarcharEnumH2Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
# H2's native ENUM is numeric; bind and store Java enums as text everywhere.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
spring.jpa.properties.hibernate.type.prefer_native_enum_types=false

# Browsable at /h2-console to inspect the raw decision tables.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
spring.mvc.problemdetails.enabled=true
server.error.include-message=always

# FairHome method traces use log.debug; keep Spring/Hibernate at INFO.
logging.level.com.fairhome=DEBUG

# Demo data. Generates a realistic intake on first start so the draw can be exercised immediately.
# Only a handful of applications are planted as held duplicates so the review queue stays easy to test.
fairhome.demo-data.enabled=true
fairhome.demo-data.applications=4000
fairhome.demo-data.duplicate-review-count=3
fairhome.demo-data.offline-percent=35
fairhome.demo-data.seed=fairhome-demo-2026

# Officer console login. Change both before exposing the app beyond localhost.
fairhome.admin.username=admin
fairhome.admin.password=admin
# Used only if a request has no signed-in user (should not happen on /admin after login).
fairhome.admin.officer-name=Allotment Officer (desk 1)
