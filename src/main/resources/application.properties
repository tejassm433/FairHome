spring.application.name=FairHome Allocation

server.port=8080

# database configuration
spring.datasource.url=jdbc:h2:file:./data/fairhome;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# Browsable at /h2-console to inspect the raw decision tables.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
spring.mvc.problemdetails.enabled=true
server.error.include-message=always

# Demo data. Generates a realistic intake on first start so the draw can be exercised immediately,
# including deliberate duplicates. Set to false for a clean, empty instance.
fairhome.demo-data.enabled=true
fairhome.demo-data.applications=4000
fairhome.demo-data.duplicate-percent=9
fairhome.demo-data.offline-percent=35
fairhome.demo-data.seed=fairhome-demo-2026

# Officer console login. Change both before exposing the app beyond localhost.
fairhome.admin.username=admin
fairhome.admin.password=FairHome@2026
# Used only if a request has no signed-in user (should not happen on /admin after login).
fairhome.admin.officer-name=Allotment Officer (desk 1)
