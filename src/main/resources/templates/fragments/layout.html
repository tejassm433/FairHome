<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} · FairHome Allocation|">FairHome Allocation</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235eead4'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='sans-serif' font-weight='bold' fill='%2304231f'>F</text></svg>">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">F</span>
            <span>FairHome
                <span class="brand-sub">Allocation</span>
            </span>
        </a>
        <nav class="links">
            <a th:href="@{/}" th:classappend="${navPage == 'home'} ? 'active'">Scheme</a>
            <a th:href="@{/apply}" th:classappend="${navPage == 'apply'} ? 'active'">Apply</a>
            <a th:href="@{/status}" th:classappend="${navPage == 'status'} ? 'active'">My status</a>
            <a th:href="@{/rules}" th:classappend="${navPage == 'rules'} ? 'active'">Rules &amp; verification</a>
            <a th:href="@{/results}" th:classappend="${navPage == 'results'} ? 'active'">Results</a>
            <a class="admin-link" th:href="@{/admin}"
               th:classappend="${navPage != null and #strings.startsWith(navPage, 'admin')} ? 'active'">Admin console</a>
        </nav>
    </div>
</header>

<main th:classappend="${narrow} ? 'narrow'">
    <div th:replace="${content}">Page content</div>
</main>

<footer class="site">
    <div class="inner">
        <span>FairHome Allocation &middot; every decision on this site is recorded with its reason and
            can be recomputed from the published rule book.</span>
        <span>
            <a th:href="@{/rules}">Published rules</a> &middot;
            <a th:href="@{/verify}">Verify a draw position</a> &middot;
            <a th:href="@{/h2-console}">Database console</a>
        </span>
    </div>
</footer>

</body>
</html>
